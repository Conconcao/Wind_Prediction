experiment:
  name: huaian_1min_raw_wsdir_overlap_15min_ahead
  site: huaian
  target_column: "ws"
  target_mode: point
  horizon_steps: 15
  base_resolution_minutes: 1

data:
  scada_1min: "C:/Users/caosh/Desktop/WTPC/data/huaian/ALL_TURBINES_1min_202307-202512.parquet"
  scada_15min_direction: "C:/Users/caosh/Desktop/WTPC/data/huaian/ALL_TURBINES_DIRECTION_15min_20231202-20240703_QC1.parquet"
  turbine_meta: "D:/Power_prediction/Data/风机基本信息汇总.csv"

split:
  method: chronological_ratio
  ratio:
    train: 0.7
    val: 0.1
    test: 0.2
  data_window_start: "2023-12-02 00:15:00"
  data_window_end: "2025-07-03 23:59:00"

modeling:
  lookback_steps: 60
  feature_columns:
    - ws
    - wd_mean
    - wd_std
    - wd_sin
    - wd_cos
    - nacelle_mean
    - nacelle_std
    - nacelle_sin
    - nacelle_cos
    - yaw_error_sin
    - yaw_error_cos
    - yaw_error_abs
  min_target_coverage: 1.0
